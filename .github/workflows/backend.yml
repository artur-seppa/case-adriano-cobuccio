name: backend

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wallet
          POSTGRES_PASSWORD: wallet
          POSTGRES_DB: wallet_test
        ports: ['5442:5432']
        options: >-
          --health-cmd "pg_isready -U wallet"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7
        ports: ['6389:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, pdo_pgsql, pcntl
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: ./vendor/bin/pint --test
      - run: php artisan migrate --env=testing --force
      - run: php artisan test
      - run: php artisan db:seed --class=SystemWalletSeeder --env=testing --force
      - run: php artisan wallet:reconcile --env=testing
      - run: php artisan scramble:export --env=testing --path=openapi.json
      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: openapi.json
