# Same-origin front door for the wallet stack.
# Mounted at /etc/nginx/conf.d/default.conf -> server-level config only (no http {}).
#
# Upstreams are resolved at request time via the Docker embedded DNS (127.0.0.11)
# instead of `upstream {}` blocks: nginx -t resolves named hosts in upstream blocks
# eagerly and fails when `app`/`web` don't exist yet. `set $x ...; proxy_pass $x;`
# with a resolver defers the lookup to runtime, so the config validates standalone
# and still targets the compose services once the stack is up.

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 2m;

    # Docker's embedded DNS. ipv6=off avoids AAAA lookups for compose service names.
    resolver 127.0.0.11 ipv6=off valid=10s;

    # Forwarded headers shared by every proxied location.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    # Server-Sent Events: long-lived connection, no buffering, no cache, no gzip.
    # Exact match -> always wins over the regex location below, regardless of file order.
    location = /api/v1/stream {
        set $upstream_app "http://app:8000";
        proxy_pass $upstream_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Prometheus scrape endpoint (`/metrics`) is deliberately NOT proxied here.
    # Docker's NAT means a host request through this published port arrives
    # with the bridge gateway as $remote_addr (e.g. 172.x.x.1), which falls
    # inside any sane "internal-only" CIDR allowlist — an IP-based restriction
    # here cannot actually keep the host out, so it isn't attempted. A real
    # Prometheus server joins the `wallet` Docker network and scrapes
    # `app:8000/metrics` directly, bypassing this public entrypoint entirely;
    # `docker compose exec app curl localhost:8000/metrics` works the same way
    # for local inspection. Falls through to the Next.js catch-all below,
    # same as any other unknown path.

    # Everything the Laravel/FrankenPHP app serves. `livewire[^/]*` is
    # Pulse's own update endpoint: Livewire generates an APP_KEY-derived
    # prefix (`/livewire-<8 hex chars>/update`), not a fixed `/livewire`
    # path — without this, every wire:poll/action on the Pulse dashboard
    # 404s against Next.js and the dashboard freezes at first paint.
    location ~ ^/(api|sanctum|docs|up|health|pulse|horizon|telescope|livewire[^/]*)(/|$) {
        set $upstream_app "http://app:8000";
        proxy_pass $upstream_app;
    }

    # Everything else -> Next.js.
    location / {
        set $upstream_web "http://web:3000";
        proxy_pass $upstream_web;
    }
}
