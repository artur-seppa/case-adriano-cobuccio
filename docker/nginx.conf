# Same-origin front door for the wallet stack.
# Mounted at /etc/nginx/conf.d/default.conf -> server-level config only (no http {}).
#
# Upstreams are resolved at request time via the Docker embedded DNS (127.0.0.11)
# instead of `upstream {}` blocks: nginx -t resolves named hosts in upstream blocks
# eagerly and fails when `app`/`web` don't exist yet. `set $x ...; proxy_pass $x;`
# with a resolver defers the lookup to runtime, so the config validates standalone
# and still targets the compose services once the stack is up.

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 2m;

    # Docker's embedded DNS. ipv6=off avoids AAAA lookups for compose service names.
    resolver 127.0.0.11 ipv6=off valid=10s;

    # Forwarded headers shared by every proxied location.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    # Server-Sent Events: long-lived connection, no buffering, no cache, no gzip.
    # Exact match -> always wins over the regex location below, regardless of file order.
    location = /api/v1/stream {
        set $upstream_app "http://app:8000";
        proxy_pass $upstream_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Prometheus scrape endpoint: reachable only from the internal Docker network,
    # never from the published port. Top-level exact-match prefix location because
    # nginx forbids a nested location inside a regex location; an exact match is
    # evaluated before any regex location, so it also shadows the regex below.
    location = /metrics {
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny all;

        set $upstream_app "http://app:8000";
        proxy_pass $upstream_app;
    }

    # Everything the Laravel/FrankenPHP app serves.
    location ~ ^/(api|sanctum|docs|up|health|pulse|horizon|telescope)(/|$) {
        set $upstream_app "http://app:8000";
        proxy_pass $upstream_app;
    }

    # Everything else -> Next.js.
    location / {
        set $upstream_web "http://web:3000";
        proxy_pass $upstream_web;
    }
}
